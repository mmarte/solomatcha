name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python3 -m pytest -q tests
      - name: Production build (fails on TODOs, health claims, bad affiliate keys)
        run: python3 build.py
      - name: Draft build
        run: python3 build.py --drafts --out /tmp/preview
